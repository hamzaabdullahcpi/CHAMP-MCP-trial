services:
  - type: web
    name: champ-mcp-knowledge-server
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build:mcp
    startCommand: npm run start:mcp
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AIRTABLE_BASE_ID
        sync: false
      - key: AIRTABLE_PAT
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
